<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>仕分コード検索</title>
<style>
:root{--bg:#f6f6f3;--fg:#1c1c1a;--card:#fff;--mut:#6b6b66;--ac:#1d5fd1;--wn:#8a5a00;--wb:#fff3d6;--bd:#d9d9d2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--fg:#ececE8;--card:#232321;--mut:#9a9a94;--ac:#7aa7ff;--wn:#f0c36a;--wb:#3a2f14;--bd:#3a3a36}}
:root[data-theme="dark"]{--bg:#171716;--fg:#ececE8;--card:#232321;--mut:#9a9a94;--ac:#7aa7ff;--wn:#f0c36a;--wb:#3a2f14;--bd:#3a3a36}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 8px}.hint{color:var(--mut);font-size:13px;margin:0 0 12px}
textarea,select,input{width:100%;box-sizing:border-box;font-size:16px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg)}
textarea{height:96px;resize:vertical}select{margin-top:8px}
.row{display:flex;gap:8px;margin:10px 0}button{font-size:16px;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
#pst{flex:1;background:var(--ac);color:#fff;border:0;font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-top:12px}
.code{font-size:64px;font-weight:800;letter-spacing:4px;line-height:1.1}.nm{color:var(--mut);font-size:14px}
.warn{background:var(--wb);color:var(--wn);border-radius:10px;padding:10px;margin-top:10px;font-size:14px}
.rb{color:var(--mut);font-size:14px;margin-top:2px}.c{display:block;width:100%;text-align:left;margin-top:8px}details{margin-top:14px}summary{color:var(--mut)}
</style></head><body><main>
<h1>仕分コード検索</h1>
<div id="setup" class="card" style="display:none"><b>コード表を読み込んでください</b><p class="hint">コード表のファイル（shiwake_data.json）を選ぶと、このiPhoneの中にだけ保存されます。外部には送られません。</p><input type="file" id="file" accept=".json,application/json"><p id="setupmsg" class="warn" style="display:none"></p></div>
<div id="app" style="display:none">
<p class="hint">住所を入力。iPhoneは入力欄をタップ→キーボードのカメラマーク「テキストをスキャン」で送り状を読み取れます。</p>
<textarea id="a" placeholder="例：神奈川県横浜市鶴見区○○町1-2-3"></textarea>
<div class="row"><button id="clr" style="flex:1">消す</button></div>
<div id="res"></div>
<details><summary>手入力で選ぶ</summary>
<select id="sp"><option value="">都道府県</option></select><select id="sc"><option value="">市区町村</option></select><select id="sw"><option value="">区（ある場合）</option></select></details>
</div>
<p class="hint" style="margin-top:24px;text-align:center">コード表：<span id="ver">未読込</span> ・ <a href="#" id="swap" style="color:inherit">入れ替える</a></p>
<script>var D,Y,Z;;
function norm(s){return s.normalize('NFKC').replace(/〒?\d{3}-?\d{4}/,'').replace(/\s/g,'').replace(/[ヶヵケ]/g,'ケ').replace(/[瀦髙﨑邊邉澤濱嶋條櫻國德]/g,function(x){return '潴高崎辺辺沢浜島条桜国徳'['瀦髙﨑邊邉澤濱嶋條櫻國德'.indexOf(x)];});}
function hit(x,r){var p=x[0];if(x.length>2){if(!r.startsWith(p))return false;var m=r.slice(p.length).match(/^\D*(\d+)/);return !!m&&+m[1]>=x[2]&&+m[1]<=x[3];}
 if(p.indexOf('○')>=0){return new RegExp('^'+p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/○/g,'.')).test(r);}return r.startsWith(p);}
function best(xs,r){var b=null;(xs||[]).forEach(function(x){if(hit(x,r)&&(!b||x[0].length>b[0].length))b=x;});return b;}
function find(addr){var a=norm(addr),all=Object.keys(D),ps=all.filter(function(p){return a.indexOf(p)>=0;}),sc=ps.length?ps:all,hs=[];
 sc.forEach(function(p){var base=ps.length?a.slice(a.indexOf(p)+p.length):a;Object.keys(D[p]).forEach(function(c){var i=base.indexOf(c);if(i>=0)hs.push({p:p,c:c,i:i,rest:base.slice(i+c.length)});});});
 if(hs.length){var mi=Math.min.apply(null,hs.map(function(h){return h.i;}));hs=hs.filter(function(h){return h.i===mi;});var ml=Math.max.apply(null,hs.map(function(h){return h.c.length;}));return hs.filter(function(h){return h.c.length===ml;});}
 sc.forEach(function(p){var base=ps.length?a.slice(a.indexOf(p)+p.length):a;Object.keys(D[p]).forEach(function(c){Object.keys(D[p][c].w||{}).forEach(function(w){if(base.indexOf(w)>=0)hs.push({p:p,c:c,w:w,rest:base.slice(base.indexOf(w))});});});});
 return hs;}
function resolve(h){var C=D[h.p][h.c],r=h.rest,o={name:h.p+h.c,warn:[],p:h.p,c:h.c,rest:h.rest},n=(C.x||[]).length,x=best(C.x,r);
 if(C.s)o.warn.push('一部の町名リストが未登録です。原本で確認してください。');
 if(x){o.code=x[1];o.why='町名の例外：'+x[0];return o;}
 if(C.w){var ks=Object.keys(C.w).filter(function(w){return r.startsWith(w);}).sort(function(a,b){return b.length-a.length;}),w=ks[0];
  if(w){var W=C.w[w],r2=r.slice(w.length),y=best(W.x,r2);o.name+=w;n+=(W.x||[]).length;
   if(y){o.code=y[1];o.why='町名の例外：'+y[0];return o;}
   o.code=W.c||W.d;if(o.code){o.why=W.c?'区':'区の「下記以外」';if(W.x)o.warn.push('この区には町名による例外があります（'+W.x.length+'件）。町名を確認してください。');return o;}}
  if(C.d){o.code=C.d;o.why='「下記以外」';return o;}
  o.need=Object.keys(C.w).map(function(k){return h.p+h.c+k;});o.msg='区を選んでください。';return o;}
 if(C.d){o.code=C.d;o.why='「下記以外」';if(n)o.warn.push('この地域には町名による例外があります（'+n+'件）。町名を確認してください。');return o;}
 if(C.b){o.code=C.b;o.why='市区町村';if(n)o.warn.push('この地域には町名による例外があります（'+n+'件）。町名を確認してください。');return o;}
 o.need=(C.x||[]).map(function(k){return h.p+h.c+k[0];}).filter(function(v,i,a){return a.indexOf(v)===i;});o.msg='町村名まで必要です。';return o;}
function near(a0){var a=norm(a0),r=[];Object.keys(D).filter(function(p){return a.indexOf(p)>=0;}).forEach(function(p){var base=a.slice(a.indexOf(p)+p.length);Object.keys(D[p]).forEach(function(c){if(c.length<3)return;var m=0;for(var i=0;i<c.length;i++)if(base[i]!==c[i])m++;if(m===1)r.push(p+c+base.slice(c.length));});});return r;}
function extract(t){var P=Object.keys(D),out=[];t.split(/\r?\n/).forEach(function(l){var s=norm(l);if(!s||/^(TEL|FAX|電話|ご不明|お問い)/i.test(s))return;var k=-1;for(var i=0;i<P.length;i++){var j=s.indexOf(P[i]);if(j>=0){k=j;break;}}out.push(k>=0?s.slice(k):s);});return out;}
function pick0(v){var n=norm(v),P=Object.keys(D),hint=P.filter(function(p){return n.indexOf(p)>=0;}),
 ev=extract(v).map(function(c){var h=find(c);if(h.length>1){var f=h.filter(function(x){return hint.indexOf(x.p)>=0;});if(f.length)h=f;}return {c:c,h:h};}),
 pk=ev.filter(function(e){return e.h.length===1;})[0]||ev.filter(function(e){return e.h.length>1;})[0]||ev.filter(function(e){return P.some(function(p){return e.c.indexOf(p)===0;});})[0]||ev[0]||{c:v,h:find(v)};
 return {addr:pk.c,hs:pk.h,o2:ev.filter(function(e){return e!==pk&&e.h.length;}).map(function(e){return e.c;})};}
function yomi(o){var p=o.p,c=o.c,pr=Y.P[p];if(!pr)return null;
 if(c.slice(-1)==='郡'){var g=Y.G[p+c];if(!g)return null;var T=Y.T[p+c]||{},ks=Object.keys(T).filter(function(k){return o.rest.indexOf(k)===0;}).sort(function(x,y){return y.length-x.length;});
  return ks[0]?{r:pr+' '+g+' '+T[ks[0]],a:ks[0]}:{r:pr+' '+g,a:''};}
 var r=Y.R[o.name];return r?{r:pr+' '+r,a:''}:null;}
function zipOf(v){var s=v.normalize('NFKC'),m=s.match(/〒\s*(\d{3})[-‐‑‒–—−ー]?(\d{4})/)||s.match(/(?:^|\n)\s*(\d{3})[-‐‑‒–—−ー](\d{4})\s*(?:\n|$)/)||s.replace(/[〇一二三四五六七八九]/g,function(x){return '〇一二三四五六七八九'.indexOf(x);}).match(/^\s*(\d{3})[\s\-‐‑‒–—−ーの]*(\d{4})\s*$/);return m?m[1]+m[2]:null;}
function zipAddr(z){var r=Z.r,lo=0,hi=r.length-1,n=+z;while(lo<=hi){var m=(lo+hi)>>1;if(n<r[m][0])hi=m-1;else if(n>r[m][1])lo=m+1;else return Z.c[r[m][2]]+(Z.t[z]||'');}return null;}
function pick(v){var p=pick0(v),z=zipOf(v),za=z?zipAddr(z):null;if(!za)return p;var zh=find(za),zl='〒'+z.slice(0,3)+'-'+z.slice(3)+' → '+za;
 if(p.hs.length!==1){if(zh.length)return {addr:zl,hs:zh,o2:[],zip:za};return p;}
 if(zh.length===1&&(zh[0].p+zh[0].c)!==(p.hs[0].p+p.hs[0].c)){p.mismatch={z:zl,a:za};}
 return p;}

var $=function(i){return document.getElementById(i);};
function esc(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function show(o,extra){var h='<div class="card">'+(o.src?'<div class="nm">読取：'+esc(o.src)+'</div>':'');
 if(o.code){var y=yomi(o);h+='<div class="nm">'+esc(o.name+(y?y.a:''))+'</div>'+(y?'<div class="rb">'+esc(y.r)+'</div>':'')+'<div class="code">'+o.code+'</div><div class="nm">'+esc(o.why)+'</div>';}
 else{h+='<b>'+esc(o.msg||'')+'</b>';(o.need||[]).slice(0,40).forEach(function(v){h+='<button class="c" data-t="'+esc(v)+'">'+esc(v)+'</button>';});}
 (o.warn||[]).forEach(function(w){h+='<div class="warn">⚠ '+esc(w)+'</div>';});
 $('res').innerHTML=h+'</div>';}
function run(){var v=$('a').value;if(!v.trim()){$('res').innerHTML='';return;}var pk=pick(v),addr=pk.addr,hs=pk.hs,o2=pk.o2,src='<div class="nm">読取：'+esc(addr)+'</div>';
 function list(title,arr){var h='<div class="card">'+src+'<b>'+title+'</b>';arr.slice(0,12).forEach(function(t){h+='<button class="c" data-t="'+esc(t)+'">'+esc(t)+'</button>';});$('res').innerHTML=h+'</div>';}
 if(!hs.length){var nr=near(addr);if(nr.length)list('もしかして（読み間違いの可能性）',nr);else $('res').innerHTML='<div class="card">'+src+'見つかりません。都道府県・市区町村から入力してください。</div>';return;}
 if(hs.length>1){list('候補から選んでください',hs.map(function(x){return x.p+x.c+(x.w||'');}));return;}
 var x=hs[0],o=x.w?resolve({p:x.p,c:x.c,rest:x.w+x.rest}):resolve(x);o.src=addr;if(pk.mismatch)o.warn.push('郵便番号の地域と住所が一致しません。〔'+pk.mismatch.z+'〕');show(o);if(pk.mismatch){var h0=$('res').innerHTML;$('res').innerHTML=h0+'<button class="c" data-t="'+esc(pk.mismatch.a)+'">郵便番号の地域で調べる：'+esc(pk.mismatch.a)+'</button>';}
 if(o2.length){var h=$('res').innerHTML;o2.forEach(function(t){h+='<button class="c" data-t="'+esc(t)+'">別の住所：'+esc(t)+'</button>';});$('res').innerHTML=h;}}
$('clr').onclick=function(){$('a').value='';$('res').innerHTML='';};
$('res').onclick=function(e){var t=e.target.getAttribute&&e.target.getAttribute('data-t');if(t){$('a').value=t;run();}};
function qinit(){var m=(location.hash+'&'+location.search).match(/[#?&]q=([^&]*)/);if(m){try{$('a').value=decodeURIComponent(m[1].replace(/\+/g,' '));run();}catch(e){}}}
$('a').addEventListener('paste',function(){setTimeout(run,100);});$('a').addEventListener('change',run);var ll=0,tm;$('a').addEventListener('input',function(){var n=this.value.length;if(n-ll>=6||(this.value.length<=14&&zipOf(this.value))){clearTimeout(tm);tm=setTimeout(run,300);}ll=n;});
var sp=$('sp'),sc=$('sc'),sw=$('sw');function populate(){sp.length=1;sc.length=1;sw.length=1;Object.keys(D).forEach(function(p){sp.add(new Option(p,p));});}
sp.onchange=function(){sc.length=1;sw.length=1;if(sp.value)Object.keys(D[sp.value]).forEach(function(c){sc.add(new Option(c,c));});};
sc.onchange=function(){sw.length=1;var C=sc.value&&D[sp.value][sc.value];if(C&&C.w)Object.keys(C.w).forEach(function(w){sw.add(new Option(w,w));});if(sc.value&&!(C.w)){$('a').value=sp.value+sc.value;run();}};
sw.onchange=function(){if(sw.value){$('a').value=sp.value+sc.value+sw.value;run();}};

var VER='';
function setData(o){D=o.D;Y=o.Y;Z=o.Z;VER=o.v||'';$('ver').textContent=VER;populate();$('setup').style.display='none';$('app').style.display='';qinit();}
function loadText(t,save){var o=JSON.parse(t);if(!o||!o.D||!o.Y||!o.Z)throw new Error('bad');setData(o);if(save){try{localStorage.setItem('shiwake_data',t);}catch(e){$('res').innerHTML='<div class="card warn">この端末に保存できませんでした。次回も読み込みが必要です。</div>';}}}
$('file').onchange=function(){var f=this.files&&this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{loadText(r.result,true);}catch(e){var m=$('setupmsg');m.textContent='読み込めませんでした。コード表のファイル（shiwake_data.json）を選んでください。';m.style.display='';}};r.readAsText(f);};
$('swap').onclick=function(e){e.preventDefault();$('setup').style.display='';};
(function(){var s=null;try{s=localStorage.getItem('shiwake_data');}catch(e){}if(s){try{loadText(s,false);return;}catch(e){}}$('setup').style.display='';})();
</script></main></body></html>
